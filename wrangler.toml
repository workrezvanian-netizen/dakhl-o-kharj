name = "dakhl-o-kharj"
main = "worker.js"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "DNK_KV"
id = "2b57ef8f39c4483db71ec44b98bdc3e6"

# هوش مصنوعی داخلی کلودفلر (بدون کلید)
[ai]
binding = "AI"

# پشتیبان قوی و رایگان (پیشنهادی — چون ChatGPT از Worker اغلب 403 می‌دهد):
#   wrangler secret put GROQ_API_KEY
#   wrangler deploy
# کلید: https://console.groq.com/keys
#
# ChatGPT اختیاری (ممکن است از IP کلودفلر کار نکند):
#   wrangler secret put OPENAI_API_KEY
